<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Task Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F7F6F2;--surface:#FFFFFF;--border:#E2E0D8;--border2:#C8C5BA;
  --text:#1A1916;--muted:#6B6860;--faint:#A8A69E;
  --green:#2D6A4F;--green-bg:#D8F3DC;
  --amber:#7D5A00;--amber-bg:#FFF3CD;
  --blue:#1A4D8F;--blue-bg:#E8F0FB;
  --red:#8B2020;--red-bg:#FDECEA;
  --orange:#8B4500;--orange-bg:#FEF0E6;
  --font:'IBM Plex Sans',sans-serif;--mono:'IBM Plex Mono',monospace;
}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:15px;min-height:100vh}
.app{max-width:700px;margin:0 auto}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:13px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20}
.topbar-brand{font-family:var(--mono);font-size:13px;font-weight:500;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.topbar-mode{font-size:12px;padding:3px 10px;border-radius:99px;font-family:var(--mono);font-weight:500}
.mode-admin{background:#1A1916;color:#F7F6F2}
.mode-volunteer{background:var(--green-bg);color:var(--green)}
.content{padding:20px}
.screen{display:none}.screen.active{display:block}
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border:1px solid var(--border2);border-radius:6px;background:var(--surface);color:var(--text);cursor:pointer;font-size:13px;font-family:var(--font);font-weight:500;transition:all .12s}
.btn:hover{background:var(--bg);border-color:var(--text)}
.btn-primary{background:var(--text);color:var(--bg);border-color:var(--text)}
.btn-primary:hover{opacity:.82;background:var(--text)}
.btn-danger{color:var(--red);border-color:transparent;background:none;padding:4px 7px}
.btn-danger:hover{background:var(--red-bg);border-color:var(--red)}
.btn-warn{background:var(--orange-bg);color:var(--orange);border-color:#F0B27A}
.btn-warn:hover{opacity:.85;background:var(--orange-bg)}
.btn-sm{padding:4px 9px;font-size:12px}
.btn-xs{padding:3px 7px;font-size:11px}
label{font-size:12px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.5px;color:var(--muted);display:block;margin:12px 0 4px}
input,textarea,select{width:100%;font-family:var(--font);font-size:14px;border:1px solid var(--border2);border-radius:6px;padding:7px 10px;background:var(--surface);color:var(--text);outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--text)}
textarea{resize:vertical;min-height:70px}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;font-family:var(--mono)}
.badge-done{background:var(--green-bg);color:var(--green)}
.badge-partial{background:var(--blue-bg);color:var(--blue)}
.badge-pending{background:var(--amber-bg);color:var(--amber)}
.badge-blocked{background:var(--red-bg);color:var(--red)}
.pri-pill{display:inline-flex;align-items:center;font-size:10px;font-family:var(--mono);padding:1px 6px;border-radius:99px;font-weight:600;flex-shrink:0}
.pri-urgent{background:#FDECEA;color:#8B2020}
.pri-high{background:#FFF3CD;color:#7D5A00}
.pri-low{background:var(--bg);color:var(--faint);border:1px solid var(--border)}
.unable-pill{display:inline-flex;align-items:center;font-size:10px;font-family:var(--mono);padding:1px 7px;border-radius:99px;font-weight:600;background:var(--red-bg);color:var(--red);flex-shrink:0}
.due-pill{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-family:var(--mono);padding:1px 7px;border-radius:99px;background:var(--amber-bg);color:var(--amber);flex-shrink:0}
.due-pill.overdue{background:var(--red-bg);color:var(--red)}
.assigned-pill{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-family:var(--mono);padding:1px 7px;border-radius:99px;background:var(--blue-bg);color:var(--blue);flex-shrink:0}
.group{margin-bottom:10px;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--surface)}
.group-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;user-select:none;gap:10px;cursor:default}
.group-title{font-size:15px;font-weight:600;flex:1}
.group-title[data-key]{cursor:text}
.group-meta{display:flex;align-items:center;gap:7px;flex-shrink:0;cursor:pointer;border-radius:6px;padding:5px 8px;margin:-5px -8px}
.group-meta:hover{background:var(--border)}
.group-body{border-top:1px solid var(--border);display:none}
.group-body.open{display:block}
.subtask-row{display:flex;align-items:flex-start;gap:9px;padding:10px 16px;border-bottom:1px solid var(--border)}
.subtask-row:last-child{border-bottom:none}
.subtask-row.is-unable{background:#FFFAF9}
.check{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--border2);flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:2px;transition:all .12s;cursor:pointer}
.check.done{background:var(--green);border-color:var(--green)}
.check.unable{background:var(--red-bg);border-color:var(--red);color:var(--red);font-size:11px;font-weight:700}
.check:hover:not(.done):not(.unable){border-color:var(--text)}
.subtask-main{flex:1;min-width:0}
.subtask-text{font-size:14px;line-height:1.5}
.subtask-text.done{text-decoration:line-through;color:var(--faint)}
.subtask-text.unable-txt{color:var(--muted)}
.by-tag{font-size:11px;font-family:var(--mono);color:var(--muted);margin-top:2px}
.note-tag{font-size:11px;color:var(--muted);font-style:italic}
.unable-reason{font-size:11px;color:var(--red);font-style:italic;margin-top:2px}
.tap-hint{font-size:11px;color:var(--faint);margin-top:3px}
.subtask-actions{display:flex;align-items:flex-start;gap:3px;flex-shrink:0;padding-top:1px}
.sub-meta-edit{background:var(--bg);border-radius:6px;padding:8px 10px;margin-top:6px;display:none;border:1px solid var(--border)}
.sub-meta-edit.open{display:block}
.inline-edit{display:none;width:100%;font-size:13px;padding:4px 7px;border:1px solid var(--text);border-radius:4px;font-family:var(--font);background:var(--surface);color:var(--text);outline:none;margin-top:3px}
.inline-edit.active{display:block}
.edit-actions{display:none;gap:4px;margin-top:4px}
.edit-actions.active{display:flex}
.add-sub-wrap{padding:10px 16px;border-top:1px solid var(--border);display:flex;gap:6px}
.add-sub-wrap input{font-size:13px;padding:5px 8px}
.tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:16px;overflow-x:auto}
.tab{padding:9px 14px;font-size:13px;font-weight:500;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab.active{color:var(--text);border-bottom-color:var(--text)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:11px;text-align:center}
.stat-n{font-size:20px;font-weight:600;font-family:var(--mono)}
.stat-l{font-size:10px;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:.5px}
.nav{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:50;align-items:center;justify-content:center;padding:16px}
.modal-bg.open{display:flex}
.modal{background:var(--surface);border-radius:10px;padding:22px;width:100%;max-width:460px;border:1px solid var(--border);max-height:92vh;overflow-y:auto}
.modal h2{font-size:16px;font-weight:600;margin-bottom:14px}
.url-box{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:9px 13px;display:flex;align-items:center;gap:8px;margin-top:5px}
.url-text{font-family:var(--mono);font-size:12px;flex:1;word-break:break-all}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 18px;border-radius:8px;font-size:13px;font-family:var(--mono);opacity:0;transition:opacity .2s;z-index:100;pointer-events:none}
.toast.show{opacity:1}
.saving{font-size:12px;font-family:var(--mono);color:var(--muted);display:none}
.saving.on{display:inline}
.empty{text-align:center;padding:36px 20px;color:var(--muted);font-size:14px}
.loading{text-align:center;padding:36px;color:var(--muted);font-family:var(--mono);font-size:13px}
.chevron{transition:transform .18s;font-size:14px;color:var(--muted);display:inline-block}
.chevron.open{transform:rotate(180deg)}
.filter-bar{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.filter-btn{padding:5px 12px;font-size:12px;border-radius:99px;border:1px solid var(--border2);background:var(--surface);cursor:pointer;font-family:var(--font);color:var(--muted);transition:all .12s}
.filter-btn.active{background:var(--text);color:var(--bg);border-color:var(--text)}
.progress-bar{height:3px;background:var(--border);border-radius:2px}
.progress-bar-inner{height:100%;border-radius:2px;background:var(--green);transition:width .4s}
.section-bar{background:var(--bg);border-bottom:1px solid var(--border);padding:5px 16px;display:flex;align-items:center;justify-content:space-between}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="topbar-brand">Task Tracker</div>
    <div id="topbar-right"></div>
  </div>
  <div class="content">
    <div id="screen-admin" class="screen">
      <div style="display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);margin-bottom:16px;gap:8px;flex-wrap:wrap">
        <div class="tabs" style="border:none;margin:0;flex:1">
          <div class="tab active" id="tab-list" onclick="showTab('list')">Tasks</div>
          <div class="tab" id="tab-paste" onclick="showTab('paste')">Import</div>
          <div class="tab" id="tab-progress" onclick="showTab('progress')">Progress</div>
          <div class="tab" id="tab-share" onclick="showTab('share')">Links</div>
        </div>
        <div style="display:flex;gap:6px;align-items:center;padding-bottom:4px;flex-shrink:0">
          <button class="btn btn-sm btn-primary" onclick="openAddModal()">+ Add task</button>
          <button class="btn btn-sm" onclick="loadData(true)" title="Refresh">&#8635;</button>
          <button class="btn btn-sm" onclick="exportCSV()" title="Export CSV">CSV</button>
          <button class="btn btn-sm" style="color:var(--red)" onclick="confirmReset()" title="Reset all completions">Reset</button>
          <span class="saving" id="saving-ind">saving...</span>
        </div>
      </div>
      <div id="pane-list"><div class="loading">Loading...</div></div>
      <div id="pane-paste" style="display:none">
        <p style="font-size:13px;color:var(--muted);margin-bottom:10px"><strong>Column order: Location | Subtask 1 | Subtask 2 ...</strong><br>Tabs or commas. Subtasks can be slash-separated in one cell.</p>
        <label>Paste spreadsheet data</label>
        <textarea id="paste-input" style="min-height:140px" placeholder="Amphitheater&#9;Move A/V to dining hall&#9;Stack chairs&#9;Clean kitchen"></textarea>
        <div style="margin-top:10px;display:flex;gap:8px">
          <button class="btn btn-primary btn-sm" onclick="importPaste()">Import</button>
          <button class="btn btn-sm" onclick="document.getElementById('paste-input').value='';document.getElementById('paste-msg').textContent=''">Clear</button>
        </div>
        <div id="paste-msg" style="margin-top:8px;font-size:13px"></div>
      </div>
      <div id="pane-progress" style="display:none">
        <div class="stats" id="stats-row"></div>
        <div id="progress-detail"></div>
      </div>
      <div id="pane-share" style="display:none">
        <div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:18px">
          <h2 style="font-size:15px;margin-bottom:14px">Shareable links</h2>
          <label>Admin (keep private)</label>
          <div class="url-box"><span class="url-text" id="admin-url">-</span><button class="btn btn-sm" onclick="copyUrl('admin-url','ca')"><span id="ca">Copy</span></button></div>
          <label style="margin-top:14px">Volunteer (share with team)</label>
          <div class="url-box"><span class="url-text" id="vol-url">-</span><button class="btn btn-sm" onclick="copyUrl('vol-url','cv')"><span id="cv">Copy</span></button></div>
        </div>
      </div>
    </div>
    <div id="screen-volunteer" class="screen">
      <div class="filter-bar">
        <span style="font-size:13px;color:var(--muted)">Show:</span>
        <button class="filter-btn active" id="filter-all" onclick="setFilter('all')">All</button>
        <button class="filter-btn" id="filter-incomplete" onclick="setFilter('incomplete')">Incomplete only</button>
        <button class="btn btn-sm" style="margin-left:auto" onclick="loadData(true)">Refresh</button>
      </div>
      <div id="vol-task-list"><div class="loading">Loading...</div></div>
    </div>
  </div>
</div>

<div class="modal-bg" id="add-modal">
  <div class="modal">
    <h2>Add task group</h2>
    <label>Location</label>
    <input id="new-location" placeholder="e.g. Amphitheater and Fitness Center"/>
    <label>Subtasks (one per line)</label>
    <textarea id="new-subtasks" placeholder="Move A/V to dining hall&#10;Stack up chairs&#10;Clean kitchen space"></textarea>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:2px">
      <div style="flex:1;min-width:160px">
        <label>Due date &amp; time (optional)</label>
        <input type="datetime-local" id="new-due"/>
      </div>
      <div style="flex:1;min-width:160px">
        <label>Assigned volunteer(s) (optional)</label>
        <input id="new-assigned" placeholder="e.g. John, Mary"/>
      </div>
    </div>
    <div style="margin-top:14px;display:flex;gap:8px">
      <button class="btn btn-primary" onclick="saveTask()">Save</button>
      <button class="btn" onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="complete-modal">
  <div class="modal">
    <h2>Mark complete</h2>
    <p style="font-size:14px;color:var(--muted);margin-bottom:14px;line-height:1.5" id="complete-sub"></p>
    <label>Your name</label>
    <input id="completer-name" placeholder="Enter your name"/>
    <label>Note (optional)</label>
    <input id="completer-note" placeholder="e.g. moved to storage room B"/>
    <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-primary" onclick="confirmComplete()">Mark done</button>
      <button class="btn btn-warn" onclick="switchToUnable()">Can't complete instead</button>
      <button class="btn" onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="unable-modal">
  <div class="modal">
    <h2>Unable to complete</h2>
    <p style="font-size:14px;color:var(--muted);margin-bottom:14px;line-height:1.5" id="unable-sub"></p>
    <label>Your name</label>
    <input id="unable-name" placeholder="Enter your name"/>
    <label>Reason why (required)</label>
    <textarea id="unable-reason" placeholder="e.g. Equipment missing, door was locked, area inaccessible..." style="min-height:80px"></textarea>
    <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-warn" onclick="confirmUnable()">Submit</button>
      <button class="btn" onclick="switchToComplete()">Mark complete instead</button>
      <button class="btn" onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="undo-modal">
  <div class="modal">
    <h2 id="undo-title">Undo?</h2>
    <p style="font-size:14px;color:var(--muted);margin-bottom:6px" id="undo-sub"></p>
    <p style="font-size:13px;color:var(--muted);margin-bottom:14px" id="undo-desc"></p>
    <div style="display:flex;gap:8px">
      <button class="btn btn-primary" onclick="confirmUndo()">Undo</button>
      <button class="btn" onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var API_KEY  = '$2a$10$NrfVE4jDUcOGoO6.3Z9kyuBsPMNZ63FaibBUBDH2Xa270MC4k9/Oe';
var BIN_ID_1 = '6a05ecc8250b1311c34d8a47'; // main tasks
var BIN_ID_2 = '6a080c31c0954111d82f4675'; // cabin tasks
var BASE     = 'https://api.jsonbin.io/v3';

var tasks = [];
var nextId = 1;
var pendingComplete = null;
var pendingUndo = null;
var isSaving = false;
var openGroups = {};
var volFilter = 'all';

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function toast(msg,dur){ var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(function(){t.classList.remove('show');},dur||2200); }
function checkSvg(){ return '<svg width="12" height="12" viewBox="0 0 12 12" fill="none"><polyline points="2,6 5,9 10,3" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>'; }
function fmtTime(iso){ if(!iso) return ''; try{ return new Date(iso).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}); }catch(e){ return ''; } }
function fmtDue(due){ if(!due) return ''; try{ var d=new Date(due); return d.toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}); }catch(e){ return due; } }
function isOverdue(due){ if(!due) return false; try{ return new Date(due)<new Date(); }catch(e){ return false; } }
function priLabel(p){ return p==='urgent'?'Urgent':p==='high'?'High':p==='low'?'Low':''; }

function migrate(s){
  if(!s.priority) s.priority='normal';
  if(s.unable===undefined) s.unable=false;
  if(!s.reason) s.reason='';
  if(!s.assigned) s.assigned='';
  if(!s.due) s.due='';
  if(!s.note) s.note='';
  return s;
}

function groupByLocation(list){
  var map={},order=[];
  list.forEach(function(t){
    if(!map[t.location]){map[t.location]=[];order.push(t.location);}
    map[t.location].push(t);
  });
  return order.map(function(loc){return {location:loc,tasks:map[loc]};});
}

function groupProgress(gTasks){
  return {
    total:gTasks.reduce(function(a,t){return a+t.subtasks.length;},0),
    done:gTasks.reduce(function(a,t){return a+t.subtasks.filter(function(s){return s.done;}).length;},0),
    unable:gTasks.reduce(function(a,t){return a+t.subtasks.filter(function(s){return s.unable;}).length;},0)
  };
}

function makeKey(str){ try{ return btoa(encodeURIComponent(str)).replace(/[^a-z0-9]/gi,'').slice(0,20); }catch(e){ return Math.random().toString(36).slice(2,10); } }

function priOrd(p){ return p==='urgent'?0:p==='high'?1:p==='low'?3:2; }

async function binGet(binId){
  var r=await fetch(BASE+'/b/'+binId+'/latest',{headers:{'X-Master-Key':API_KEY,'X-Bin-Versioning':'false'}});
  if(!r.ok) throw new Error('GET '+r.status+' bin '+binId);
  return (await r.json()).record;
}

async function binPut(binId,data){
  var r=await fetch(BASE+'/b/'+binId,{method:'PUT',headers:{'X-Master-Key':API_KEY,'Content-Type':'application/json','X-Bin-Versioning':'false'},body:JSON.stringify(data)});
  if(!r.ok) throw new Error('PUT '+r.status+' bin '+binId);
  return r.json();
}

async function loadData(showToast){
  try{
    // fetch both bins in parallel
    var results=await Promise.allSettled([binGet(BIN_ID_1),binGet(BIN_ID_2)]);
    var rec1=results[0].status==='fulfilled'?results[0].value:{tasks:[],nextId:1};
    var rec2=results[1].status==='fulfilled'?results[1].value:{tasks:[],nextId:1};
    if(results[0].status==='rejected') toast('Warning: main bin failed to load');
    if(results[1].status==='rejected') toast('Warning: cabin bin failed to load');
    // tag each task with which bin it came from
    var t1=Array.isArray(rec1.tasks)?rec1.tasks:[];
    var t2=Array.isArray(rec2.tasks)?rec2.tasks:[];
    t1.forEach(function(t){t._bin=1;});
    t2.forEach(function(t){t._bin=2;});
    tasks=t1.concat(t2);
    // nextId tracked per-bin; for new admin tasks we always use bin 1's nextId
    nextId=rec1.nextId||(t1.length?Math.max.apply(null,t1.map(function(t){return t.id;}))+1:1);
    tasks.forEach(function(t){t.subtasks.forEach(function(s){migrate(s);});});
    if(showToast) toast('Refreshed');
  }catch(e){ console.error(e); toast('Failed to load'); }
  renderCurrent();
}

async function saveData(){
  if(isSaving) return;
  isSaving=true;
  var ind=document.getElementById('saving-ind');
  if(ind) ind.classList.add('on');
  try{
    // split tasks back by bin
    var bin1Tasks=tasks.filter(function(t){return t._bin!==2;});
    var bin2Tasks=tasks.filter(function(t){return t._bin===2;});
    // strip _bin tag before saving
    function strip(arr){return arr.map(function(t){var c=Object.assign({},t);delete c._bin;return c;});}
    // compute bin2's nextId
    var nextId2=bin2Tasks.length?Math.max.apply(null,bin2Tasks.map(function(t){return t.id;}))+1:1;
    var saves=[binPut(BIN_ID_1,{tasks:strip(bin1Tasks),nextId:nextId})];
    if(bin2Tasks.length) saves.push(binPut(BIN_ID_2,{tasks:strip(bin2Tasks),nextId:nextId2}));
    await Promise.all(saves);
  }catch(e){ console.error(e); toast('Save failed'); }
  isSaving=false;
  if(ind) ind.classList.remove('on');
}

function getMode(){ return new URLSearchParams(window.location.search).get('mode'); }
function show(id){ document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active');}); document.getElementById('screen-'+id).classList.add('active'); }
function renderCurrent(){ var m=getMode(); if(m==='admin') renderAdmin(); if(m==='volunteer') renderVolunteer(); }

async function init(){
  var mode=getMode();
  if(mode==='admin'){
    show('admin');
    document.getElementById('topbar-right').innerHTML='<span class="topbar-mode mode-admin">Admin</span>';
    await loadData(false); setShareUrls();
  } else if(mode==='volunteer'){
    show('volunteer');
    document.getElementById('topbar-right').innerHTML='<span class="topbar-mode mode-volunteer">Volunteer</span>';
    await loadData(false);
  } else {
    window.location.replace(window.location.pathname+'?mode=volunteer');
  }
}

function setShareUrls(){
  var base=window.location.href.split('?')[0];
  document.getElementById('admin-url').textContent=base+'?mode=admin';
  document.getElementById('vol-url').textContent=base+'?mode=volunteer';
}

function copyUrl(src,btn){
  navigator.clipboard.writeText(document.getElementById(src).textContent).then(function(){
    var el=document.getElementById(btn); el.textContent='Copied!'; setTimeout(function(){el.textContent='Copy';},2000);
  });
}

function showTab(tab){
  ['list','paste','progress','share'].forEach(function(t){
    var p=document.getElementById('pane-'+t),b=document.getElementById('tab-'+t);
    if(p) p.style.display=t===tab?'block':'none';
    if(b) b.classList.toggle('active',t===tab);
  });
  if(tab==='progress') renderProgress();
  if(tab==='list') renderAdmin();
}

function setFilter(f){
  volFilter=f;
  document.getElementById('filter-all').classList.toggle('active',f==='all');
  document.getElementById('filter-incomplete').classList.toggle('active',f==='incomplete');
  renderVolunteer();
}

function toggleGroup(key){
  openGroups[key]=!openGroups[key];
  var b=document.getElementById('gb-'+key),c=document.getElementById('gc-'+key);
  if(b) b.classList.toggle('open',openGroups[key]);
  if(c) c.classList.toggle('open',openGroups[key]);
}

function toggleSubMeta(pid){
  var el=document.getElementById('sme-'+pid);
  if(el) el.classList.toggle('open');
}

function buildSubAdmin(t,s,i){
  var pid=t.id+'-'+i;
  var od=isOverdue(s.due);
  var pills='';
  if(s.priority&&s.priority!=='normal') pills+='<span class="pri-pill pri-'+s.priority+'">'+priLabel(s.priority)+'</span> ';
  if(s.due) pills+='<span class="due-pill'+(od?' overdue':'')+'">Due: '+esc(fmtDue(s.due))+(od?' OVERDUE':'')+'</span> ';
  if(s.assigned) pills+='<span class="assigned-pill">'+esc(s.assigned)+'</span> ';
  if(s.unable) pills+='<span class="unable-pill">Unable</span>';

  return '<div class="subtask-row'+(s.unable?' is-unable':'')+'" id="sr-'+pid+'">'
    +'<div class="check'+(s.done?' done':s.unable?' unable':'')+'"'
    +(s.done||s.unable?' onclick="openUndo('+t.id+','+i+')" title="Click to undo"':' style="cursor:default"')+'>'
    +(s.done?checkSvg():s.unable?'!':'')
    +'</div>'
    +'<div class="subtask-main">'
    +'<div style="display:flex;align-items:center;gap:5px;flex-wrap:wrap">'
    +'<span class="subtask-text'+(s.done?' done':s.unable?' unable-txt':'')+'" id="st-'+pid+'" ondblclick="startEditSubtask('+t.id+','+i+')">'+esc(s.text)+'</span>'
    +pills
    +'</div>'
    +'<input class="inline-edit" id="se-'+pid+'" value="'+esc(s.text)+'" onkeydown="subtaskEditKey(event,'+t.id+','+i+')"/>'
    +'<div class="edit-actions" id="sea-'+pid+'">'
    +'<button class="btn btn-xs btn-primary" onclick="saveSubtaskEdit('+t.id+','+i+')">Save</button>'
    +'<button class="btn btn-xs" onclick="cancelSubtaskEdit('+t.id+','+i+')">Cancel</button>'
    +'</div>'
    +(s.done?'<div class="by-tag">Done: '+esc(s.by)+' &middot; '+fmtTime(s.completedAt)+(s.note?' &middot; '+esc(s.note):'')+'</div>':'')
    +(s.unable?'<div class="unable-reason">Unable: '+esc(s.by)+' &mdash; "'+esc(s.reason)+'" &middot; '+fmtTime(s.completedAt)+'</div>':'')
    +'<div class="sub-meta-edit" id="sme-'+pid+'">'
    +'<div style="font-size:11px;font-family:var(--mono);color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px">Subtask settings</div>'
    +'<div style="display:flex;gap:8px;flex-wrap:wrap">'
    +'<div style="flex:1;min-width:120px"><div style="font-size:11px;color:var(--muted);margin-bottom:2px">Priority</div>'
    +'<select onchange="changeSubPriority('+t.id+','+i+',this.value)">'
    +'<option value="normal"'+(( s.priority||'normal')==='normal'?' selected':'')+'>Normal</option>'
    +'<option value="urgent"'+(s.priority==='urgent'?' selected':'')+'>Urgent</option>'
    +'<option value="high"'+(s.priority==='high'?' selected':'')+'>High</option>'
    +'<option value="low"'+(s.priority==='low'?' selected':'')+'>Low</option>'
    +'</select></div>'
    +'<div style="flex:2;min-width:180px"><div style="font-size:11px;color:var(--muted);margin-bottom:2px">Due date &amp; time</div>'
    +'<input type="datetime-local" value="'+(s.due||'')+'" onchange="changeSubDue('+t.id+','+i+',this.value)"/>'
    +'</div></div>'
    +'<div style="margin-top:6px"><div style="font-size:11px;color:var(--muted);margin-bottom:2px">Assigned volunteer(s)</div>'
    +'<input type="text" value="'+esc(s.assigned||'')+'" placeholder="e.g. John, Mary" onchange="changeSubAssigned('+t.id+','+i+',this.value)"/>'
    +'</div></div>'
    +'</div>'
    +'<div class="subtask-actions">'
    +'<button class="btn btn-xs" onclick="toggleSubMeta(\''+pid+'\')" title="Settings" style="font-size:11px;padding:3px 6px">&#9881;</button>'
    +'<button class="btn btn-danger btn-xs" onclick="removeSubtask('+t.id+','+i+')" title="Remove">x</button>'
    +'</div>'
    +'</div>';
}

function buildSubVolunteer(t,s,i){
  if(volFilter==='incomplete'&&(s.done||s.unable)) return '';
  var od=isOverdue(s.due);
  var pills='';
  if(s.priority&&s.priority!=='normal') pills+='<span class="pri-pill pri-'+s.priority+'">'+priLabel(s.priority)+'</span> ';
  if(s.due) pills+='<span class="due-pill'+(od?' overdue':'')+'">Due: '+esc(fmtDue(s.due))+(od?' OVERDUE':'')+'</span> ';
  if(s.assigned) pills+='<span class="assigned-pill">'+esc(s.assigned)+'</span> ';
  if(s.unable) pills+='<span class="unable-pill">Unable</span>';

  var clickable=!s.done&&!s.unable;
  return '<div class="subtask-row'+(s.unable?' is-unable':'')+'"'
    +(clickable?' style="cursor:pointer" onclick="openComplete('+t.id+','+i+')"':'')+'>'
    +'<div class="check'+(s.done?' done':s.unable?' unable':'')+'">'+(s.done?checkSvg():s.unable?'!':'')+'</div>'
    +'<div class="subtask-main">'
    +'<div style="display:flex;align-items:center;gap:5px;flex-wrap:wrap">'
    +'<span class="subtask-text'+(s.done?' done':s.unable?' unable-txt':'')+'">'+esc(s.text)+'</span>'
    +pills
    +'</div>'
    +(s.done?'<div class="by-tag">Done by '+esc(s.by)+' &middot; '+fmtTime(s.completedAt)+(s.note?' &middot; <em>'+esc(s.note)+'</em>':'')+'</div>':'')
    +(s.unable?'<div class="unable-reason">'+esc(s.by)+' flagged unable: "'+esc(s.reason)+'"</div>':'')
    +(!s.done&&!s.unable?'<div class="tap-hint">Tap to complete or flag as unable</div>':'')
    +'</div></div>';
}

function buildLocationGroup(g,isAdmin){
  var key=makeKey(g.location);
  var gp=groupProgress(g.tasks);
  var total=gp.total,done=gp.done,unable=gp.unable;

  if(!isAdmin&&volFilter==='incomplete'){
    var vis=g.tasks.reduce(function(a,t){return a+t.subtasks.filter(function(s){return !s.done&&!s.unable;}).length;},0);
    if(vis===0) return '';
  }

  var pct=total?Math.round(done/total*100):0;
  var allDone=done===total;
  var bc=allDone?'badge-done':unable>0?'badge-blocked':done>0?'badge-partial':'badge-pending';
  var bt=allDone?'Done':unable>0?unable+' blocked':done>0?pct+'%':'Pending';
  if(openGroups[key]===undefined) openGroups[key]=isAdmin;
  var isOpen=openGroups[key];

  var tasksHtml=g.tasks.map(function(t){
    var sorted=t.subtasks.map(function(s,i){return {s:s,i:i};}).sort(function(a,b){return priOrd(a.s.priority||'normal')-priOrd(b.s.priority||'normal');});
    var subsHtml=sorted.map(function(x){return isAdmin?buildSubAdmin(t,x.s,x.i):buildSubVolunteer(t,x.s,x.i);}).join('');
    var tdone=t.subtasks.filter(function(s){return s.done;}).length;
    var ttotal=t.subtasks.length;
    if(isAdmin){
      return '<div style="border-bottom:1px solid var(--border)">'
        +'<div class="section-bar"><span style="font-size:11px;font-family:var(--mono);color:var(--muted)">'+tdone+'/'+ttotal+' done</span>'
        +'<button class="btn btn-danger btn-xs" onclick="deleteTask('+t.id+')">Delete group</button></div>'
        +subsHtml
        +'<div class="add-sub-wrap"><input id="add-sub-'+t.id+'" placeholder="Add subtask..." onkeydown="if(event.key===\'Enter\') addSubtask('+t.id+')"/>'
        +'<button class="btn btn-sm btn-primary" onclick="addSubtask('+t.id+')">Add</button></div>'
        +'</div>';
    }
    return subsHtml;
  }).join('');

  var editWrap=isAdmin?'<div id="gloc-edit-wrap-'+key+'" style="display:none;padding:10px 16px;border-top:1px solid var(--border)">'
    +'<input id="gloc-edit-'+key+'" value="'+esc(g.location)+'" style="font-size:15px;font-weight:600" onkeydown="locationEditKey(event,\''+key+'\')" />'
    +'<div style="display:flex;gap:6px;margin-top:8px">'
    +'<button class="btn btn-sm btn-primary" onclick="saveLocationEdit(\''+key+'\')">Save</button>'
    +'<button class="btn btn-sm" onclick="cancelLocationEdit(\''+key+'\')">Cancel</button>'
    +'</div></div>':'';

  return '<div class="group">'
    +'<div class="group-header"'+(isAdmin?'':' onclick="toggleGroup(\''+key+'\')" style="cursor:pointer"')+'>'
    +'<span class="group-title" id="gloc-'+key+'" data-key="'+key+'" data-loc="'+esc(g.location)+'"'
    +(isAdmin?' title="Double-click to edit location"':'')
    +'>'+esc(g.location)+'</span>'
    +'<div class="group-meta"'+(isAdmin?' onclick="toggleGroup(\''+key+'\')"':'')+' >'
    +'<span style="font-family:var(--mono);font-size:12px;color:var(--muted)">'+done+'/'+total+'</span>'
    +'<span class="badge '+bc+'">'+bt+'</span>'
    +'<span class="chevron'+(isOpen?' open':'')+'" id="gc-'+key+'">&#9662;</span>'
    +'</div></div>'
    +editWrap
    +'<div class="group-body'+(isOpen?' open':'')+'" id="gb-'+key+'">'+tasksHtml+'</div>'
    +'<div class="progress-bar" style="margin:4px 16px 8px"><div class="progress-bar-inner" style="width:'+pct+'%"></div></div>'
    +'</div>';
}

function renderAdmin(){
  var el=document.getElementById('pane-list'); if(!el) return;
  if(!tasks.length){el.innerHTML='<div class="empty">No tasks yet. Add one or paste from a spreadsheet.</div>';return;}
  el.innerHTML=groupByLocation(tasks).map(function(g){return buildLocationGroup(g,true);}).join('');
}

function renderVolunteer(){
  var el=document.getElementById('vol-task-list'); if(!el) return;
  if(!tasks.length){el.innerHTML='<div class="empty">No tasks yet.</div>';return;}
  var html=groupByLocation(tasks).map(function(g){return buildLocationGroup(g,false);}).join('');
  el.innerHTML=html||'<div class="empty">All tasks complete!</div>';
}

function renderProgress(){
  var total=tasks.reduce(function(a,t){return a+t.subtasks.length;},0);
  var done=tasks.reduce(function(a,t){return a+t.subtasks.filter(function(s){return s.done;}).length;},0);
  var unable=tasks.reduce(function(a,t){return a+t.subtasks.filter(function(s){return s.unable;}).length;},0);
  var pct=total?Math.round(done/total*100):0;
  document.getElementById('stats-row').innerHTML=
    '<div class="stat"><div class="stat-n">'+done+'/'+total+'</div><div class="stat-l">Done</div></div>'
    +'<div class="stat"><div class="stat-n">'+pct+'%</div><div class="stat-l">Overall</div></div>'
    +'<div class="stat"><div class="stat-n" style="color:var(--red)">'+unable+'</div><div class="stat-l">Blocked</div></div>'
    +'<div class="stat"><div class="stat-n">'+tasks.length+'</div><div class="stat-l">Groups</div></div>';

  document.getElementById('progress-detail').innerHTML=groupByLocation(tasks).map(function(g){
    var gp=groupProgress(g.tasks);
    var gd=gp.done,gt=gp.total,gu=gp.unable;
    var gpct=Math.round(gd/gt*100);
    var subsHtml=g.tasks.map(function(t){
      return t.subtasks.map(function(s){
        var color=s.done?'var(--green)':s.unable?'var(--red)':'var(--faint)';
        var sym=s.done?'done':s.unable?'unable':'pending';
        var detail='';
        if(s.due) detail+=' | Due: '+fmtDue(s.due);
        if(s.assigned) detail+=' | Assigned: '+s.assigned;
        if(s.done) detail+=' | Done by: '+s.by+' '+fmtTime(s.completedAt)+(s.note?' "'+s.note+'"':'');
        if(s.unable) detail+=' | Unable: '+s.by+' "'+s.reason+'"';
        return '<div style="font-size:12px;padding:3px 0;color:var(--muted);display:flex;gap:6px">'
          +'<span style="color:'+color+';flex-shrink:0">'+(s.done?'done':s.unable?'unable':'pending')+'</span>'
          +'<span>'+esc(s.text)+esc(detail)+'</span></div>';
      }).join('');
    }).join('');
    return '<div style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:13px 16px;margin-bottom:10px">'
      +'<div style="display:flex;justify-content:space-between;margin-bottom:5px">'
      +'<span style="font-weight:600;font-size:14px">'+esc(g.location)+'</span>'
      +'<span style="font-family:var(--mono);font-size:12px;color:var(--muted)">'+gd+'/'+gt+' ('+gpct+'%)'+(gu?' | '+gu+' blocked':'')+'</span>'
      +'</div>'
      +'<div class="progress-bar" style="margin:0 0 10px"><div class="progress-bar-inner" style="width:'+gpct+'%"></div></div>'
      +subsHtml+'</div>';
  }).join('');
}

function openAddModal(){ document.getElementById('add-modal').classList.add('open'); setTimeout(function(){document.getElementById('new-location').focus();},50); }
function closeModal(){ document.querySelectorAll('.modal-bg').forEach(function(m){m.classList.remove('open');}); pendingComplete=null; pendingUndo=null; }

async function saveTask(){
  var location=document.getElementById('new-location').value.trim();
  var raw=document.getElementById('new-subtasks').value.trim();
  var due=document.getElementById('new-due').value;
  var assigned=document.getElementById('new-assigned').value.trim();
  if(!location||!raw){alert('Fill in location and at least one subtask.');return;}
  var subtasks=raw.split('\n').map(function(s){return s.trim();}).filter(Boolean).map(function(text){return {text:text,done:false,unable:false,by:'',note:'',reason:'',completedAt:null,priority:'normal',due:due,assigned:assigned};});
  tasks.push({id:nextId++,location:location,subtasks:subtasks});
  await saveData();
  document.getElementById('new-location').value='';
  document.getElementById('new-subtasks').value='';
  document.getElementById('new-due').value='';
  document.getElementById('new-assigned').value='';
  closeModal(); renderAdmin(); toast('Task group saved');
}

async function deleteTask(id){
  if(!confirm('Delete this task group?')) return;
  tasks=tasks.filter(function(t){return t.id!==id;});
  await saveData(); renderAdmin(); toast('Deleted');
}

async function addSubtask(taskId){
  var inp=document.getElementById('add-sub-'+taskId);
  var text=inp.value.trim(); if(!text) return;
  var task=tasks.find(function(t){return t.id===taskId;}); if(!task) return;
  task.subtasks.push({text:text,done:false,unable:false,by:'',note:'',reason:'',completedAt:null,priority:'normal',due:'',assigned:''});
  inp.value=''; await saveData(); renderAdmin(); toast('Subtask added');
}

async function removeSubtask(taskId,idx){
  if(!confirm('Remove this subtask?')) return;
  var task=tasks.find(function(t){return t.id===taskId;}); if(!task) return;
  task.subtasks.splice(idx,1);
  await saveData(); renderAdmin(); toast('Removed');
}

function startEditSubtask(taskId,idx){
  var pid=taskId+'-'+idx;
  document.getElementById('st-'+pid).style.display='none';
  var inp=document.getElementById('se-'+pid),ea=document.getElementById('sea-'+pid);
  inp.classList.add('active'); ea.classList.add('active'); inp.focus(); inp.select();
}
function cancelSubtaskEdit(taskId,idx){
  var pid=taskId+'-'+idx;
  var task=tasks.find(function(t){return t.id===taskId;});
  document.getElementById('se-'+pid).value=task.subtasks[idx].text;
  document.getElementById('se-'+pid).classList.remove('active');
  document.getElementById('sea-'+pid).classList.remove('active');
  document.getElementById('st-'+pid).style.display='';
}
async function saveSubtaskEdit(taskId,idx){
  var pid=taskId+'-'+idx;
  var val=document.getElementById('se-'+pid).value.trim();
  if(!val){alert('Cannot be empty.');return;}
  tasks.find(function(t){return t.id===taskId;}).subtasks[idx].text=val;
  await saveData(); renderAdmin(); toast('Saved');
}
function subtaskEditKey(e,taskId,idx){ if(e.key==='Enter') saveSubtaskEdit(taskId,idx); if(e.key==='Escape') cancelSubtaskEdit(taskId,idx); }

function startEditLocation(key,oldLoc){
  var titleEl=document.getElementById('gloc-'+key);
  var wrapEl=document.getElementById('gloc-edit-wrap-'+key);
  var inp=document.getElementById('gloc-edit-'+key);
  if(!titleEl||!wrapEl||!inp) return;
  inp.value=titleEl.getAttribute('data-loc')||'';
  titleEl.style.display='none';
  wrapEl.style.display='block';
  inp.focus(); inp.select();
}
function cancelLocationEdit(key){
  var wrapEl=document.getElementById('gloc-edit-wrap-'+key);
  var titleEl=document.getElementById('gloc-'+key);
  if(wrapEl) wrapEl.style.display='none';
  if(titleEl) titleEl.style.display='';
}
async function saveLocationEdit(key){
  var inp=document.getElementById('gloc-edit-'+key);
  var val=inp.value.trim();
  if(!val){alert('Cannot be empty.');return;}
  var titleEl=document.getElementById('gloc-'+key);
  var oldLoc=titleEl?titleEl.getAttribute('data-loc'):'';
  if(!oldLoc){alert('Could not find location to update.');return;}
  // update tasks in memory
  tasks.forEach(function(t){if(t.location===oldLoc) t.location=val;});
  // update the title span in place (no full re-render needed)
  if(titleEl){
    titleEl.textContent=val;
    titleEl.setAttribute('data-loc',val);
  }
  // hide edit wrap and show title again
  cancelLocationEdit(key);
  // save to server
  await saveData();
  toast('Location updated');
}
function locationEditKey(e,key){
  if(e.key==='Enter') saveLocationEdit(key);
  if(e.key==='Escape') cancelLocationEdit(key);
}

async function changeSubPriority(taskId,idx,val){
  var t=tasks.find(function(t){return t.id===taskId;}); if(t){t.subtasks[idx].priority=val; await saveData();}
}
async function changeSubDue(taskId,idx,val){
  var t=tasks.find(function(t){return t.id===taskId;}); if(t){t.subtasks[idx].due=val; await saveData(); renderAdmin();}
}
async function changeSubAssigned(taskId,idx,val){
  var t=tasks.find(function(t){return t.id===taskId;}); if(t){t.subtasks[idx].assigned=val;}
}

function openComplete(taskId,idx){
  var task=tasks.find(function(t){return t.id===taskId;}); if(!task) return;
  pendingComplete={taskId:taskId,idx:idx};
  document.getElementById('complete-sub').textContent=task.subtasks[idx].text;
  document.getElementById('completer-name').value='';
  document.getElementById('completer-note').value='';
  document.getElementById('complete-modal').classList.add('open');
  setTimeout(function(){document.getElementById('completer-name').focus();},60);
}

async function confirmComplete(){
  var name=document.getElementById('completer-name').value.trim();
  if(!name){alert('Please enter your name.');return;}
  var note=document.getElementById('completer-note').value.trim();
  var s=tasks.find(function(t){return t.id===pendingComplete.taskId;}).subtasks[pendingComplete.idx];
  s.done=true; s.unable=false; s.by=name; s.note=note; s.reason=''; s.completedAt=new Date().toISOString();
  await saveData(); closeModal(); renderVolunteer(); toast('Marked complete');
}

function switchToUnable(){
  var sub=document.getElementById('complete-sub').textContent;
  var name=document.getElementById('completer-name').value;
  document.getElementById('complete-modal').classList.remove('open');
  document.getElementById('unable-sub').textContent=sub;
  document.getElementById('unable-name').value=name;
  document.getElementById('unable-reason').value='';
  document.getElementById('unable-modal').classList.add('open');
  setTimeout(function(){document.getElementById('unable-name').focus();},60);
}

function switchToComplete(){
  var sub=document.getElementById('unable-sub').textContent;
  var name=document.getElementById('unable-name').value;
  document.getElementById('unable-modal').classList.remove('open');
  document.getElementById('complete-sub').textContent=sub;
  document.getElementById('completer-name').value=name;
  document.getElementById('completer-note').value='';
  document.getElementById('complete-modal').classList.add('open');
}

async function confirmUnable(){
  var name=document.getElementById('unable-name').value.trim();
  if(!name){alert('Please enter your name.');return;}
  var reason=document.getElementById('unable-reason').value.trim();
  if(!reason){alert('Please enter a reason.');return;}
  var s=tasks.find(function(t){return t.id===pendingComplete.taskId;}).subtasks[pendingComplete.idx];
  s.done=false; s.unable=true; s.by=name; s.reason=reason; s.note=''; s.completedAt=new Date().toISOString();
  await saveData(); closeModal(); renderVolunteer(); toast('Flagged as unable');
}

function openUndo(taskId,idx){
  var task=tasks.find(function(t){return t.id===taskId;}); if(!task) return;
  var s=task.subtasks[idx]; pendingUndo={taskId:taskId,idx:idx};
  document.getElementById('undo-title').textContent=s.unable?'Clear unable flag?':'Undo completion?';
  document.getElementById('undo-sub').textContent=s.text;
  document.getElementById('undo-desc').textContent=(s.unable?'Flagged unable by ':'Completed by ')+(s.by||'')+(s.completedAt?' on '+fmtTime(s.completedAt):'');
  document.getElementById('undo-modal').classList.add('open');
}

async function confirmUndo(){
  var s=tasks.find(function(t){return t.id===pendingUndo.taskId;}).subtasks[pendingUndo.idx];
  s.done=false; s.unable=false; s.by=''; s.note=''; s.reason=''; s.completedAt=null;
  await saveData(); closeModal(); renderAdmin(); toast('Cleared');
}

async function importPaste(){
  var raw=document.getElementById('paste-input').value.trim();
  var msg=document.getElementById('paste-msg'); if(!raw) return;
  var count=0;
  raw.split('\n').filter(function(l){return l.trim();}).forEach(function(line){
    var cols=line.includes('\t')?line.split('\t'):line.split(',');
    var c=cols.map(function(x){return x.trim().replace(/^"|"$/g,'');});
    if(c.length<2) return;
    var location=c[0];
    var rest=c.slice(1);
    var subtasks=rest.filter(Boolean).reduce(function(a,s){return a.concat(s.split('/').map(function(x){return x.trim();}).filter(Boolean));},[]).map(function(text){return {text:text,done:false,unable:false,by:'',note:'',reason:'',completedAt:null,priority:'normal',due:'',assigned:''};});
    if(!subtasks.length) return;
    tasks.push({id:nextId++,location:location,subtasks:subtasks}); count++;
  });
  if(count){
    await saveData();
    msg.style.color='var(--green)'; msg.textContent='Imported '+count+' group'+(count!==1?'s':'')+'.';
    document.getElementById('paste-input').value='';
    setTimeout(function(){showTab('list');},900);
    toast(count+' group'+(count!==1?'s':'')+' imported');
  } else {
    msg.style.color='var(--red)'; msg.textContent='No valid rows. Expected: Location | Subtask1 | Subtask2 ...';
  }
}

async function confirmReset(){
  if(!confirm('Reset ALL completions and unable flags? Keeps tasks, clears all names/notes/timestamps.')) return;
  tasks.forEach(function(t){t.subtasks.forEach(function(s){s.done=false;s.unable=false;s.by='';s.note='';s.reason='';s.completedAt=null;});});
  await saveData(); renderAdmin(); toast('All completions reset');
}

function exportCSV(){
  var rows=[['Location','Subtask','Priority','Assigned','Due','Status','By','At','Note/Reason']];
  tasks.forEach(function(t){t.subtasks.forEach(function(s){rows.push([t.location,s.text,s.priority||'normal',s.assigned||'',s.due?fmtDue(s.due):'',s.done?'Done':s.unable?'Unable':'Pending',s.by||'',s.completedAt?fmtTime(s.completedAt):'',s.done?s.note||'':s.unable?s.reason||'':'']);});});
  var csv=rows.map(function(r){return r.map(function(v){return '"'+String(v).replace(/"/g,'""')+'"';}).join(',');}).join('\n');
  var a=document.createElement('a'); a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv); a.download='tasks-'+new Date().toISOString().slice(0,10)+'.csv'; a.click(); toast('CSV downloaded');
}

// Global double-click: edit location title in admin
document.addEventListener('dblclick',function(e){
  if(getMode()!=='admin') return;
  var el=e.target.closest('[data-key][data-loc]');
  if(!el) return;
  startEditLocation(el.getAttribute('data-key'), el.getAttribute('data-loc'));
});

document.addEventListener('keydown',function(e){
  if(e.key==='Escape') closeModal();
  if(e.key==='Enter'&&document.getElementById('complete-modal').classList.contains('open')) confirmComplete();
  if(e.key==='Enter'&&document.getElementById('unable-modal').classList.contains('open')&&e.target.tagName!=='TEXTAREA') confirmUnable();
  if(e.key==='Enter'&&document.getElementById('add-modal').classList.contains('open')&&e.target.tagName!=='TEXTAREA') saveTask();
});

init();
</script>
